<!doctype html>
<html lang="id">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="robots" content="noindex">
  <title>Halaman tidak ditemukan | Alghifari &amp; Laeli</title>
  <meta name="theme-color" content="#2F3322">
  <script>
    // Pretty guest links: /<repo>/fauzan-wafi  →  /<repo>/?to=fauzan-wafi
    // GitHub Pages serves this file for unknown paths, so we can redirect
    // without any server. Only one path segment after the site root is accepted.
    (function () {
      var parts = location.pathname.split("/").filter(Boolean);
      var onProjectSite = /\.github\.io$|^onepercent\.my\.id$/i.test(location.hostname); // repo name is the first path segment
      var root = onProjectSite && parts.length ? "/" + parts[0] + "/" : "/";
      var rest = onProjectSite ? parts.slice(1) : parts;
      if (rest.length === 1 && /^[a-z0-9][a-z0-9-]{1,79}$/i.test(rest[0]) && !/\./.test(rest[0])) {
        location.replace(root + "?to=" + encodeURIComponent(rest[0].toLowerCase()) + location.hash);
        return;
      }
      document.documentElement.setAttribute("data-root", root);
    })();
  </script>
  <style>
    :root { color-scheme: dark; }
    * { box-sizing: border-box; margin: 0; }
    body {
      min-height: 100vh; min-height: 100svh; display: grid; place-items: center; padding: 2rem 1.5rem;
      background: #2f3322; color: #f4f2ea; text-align: center;
      font: 400 1rem/1.7 "Manrope", "Segoe UI", system-ui, -apple-system, sans-serif;
    }
    svg { width: 40px; height: 40px; margin: 0 auto 1.75rem; fill: none; stroke: #d1beb0; stroke-width: 1.2; stroke-linecap: round; stroke-linejoin: round; }
    p.e { font-size: .6875rem; letter-spacing: .34em; text-transform: uppercase; color: #d1beb0; margin-bottom: 1rem; }
    h1 { font: 400 clamp(2.3rem, 10vw, 3.2rem)/1.1 "Marcellus", "Palatino Linotype", Palatino, Georgia, serif; margin-bottom: 1.25rem; }
    p.t { max-width: 26rem; margin: 0 auto 2.25rem; color: #c9c7b6; }
    a {
      display: inline-flex; align-items: center; min-height: 52px; padding: 0 1.75rem;
      border: 1px solid rgba(244, 242, 234, .55); border-radius: 999px; color: #f4f2ea; text-decoration: none;
      font-size: .75rem; letter-spacing: .24em; text-transform: uppercase;
    }
    a:hover, a:focus-visible { background: #f4f2ea; color: #2f3322; outline: none; }
  </style>
</head>
<body>
  <main>
    <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M3 21C3 11.1 11.5 4.1 20.7 3.3C19.9 12.5 12.9 21 3 21Z"/><path d="M3 21 15 9"/></svg>
    <p class="e">Resepsi Pernikahan Alghifari &amp; Laeli</p>
    <h1>Halaman tidak ditemukan</h1>
    <p class="t">Tautan yang Anda buka mungkin keliru atau sudah berubah. Silakan kembali ke undangan.</p>
    <a id="home" href="/">Buka Undangan</a>
  </main>
  <script>
    document.getElementById("home").href = document.documentElement.getAttribute("data-root") || "/";
  </script>
</body>
</html>
